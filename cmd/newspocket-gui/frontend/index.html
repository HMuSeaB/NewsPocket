<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsPocket 管理控制台</title>
    <link rel="stylesheet" href="/src/style.css">
</head>

<body class="dark-theme">
    <div id="app">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-badge">NEWSPOCKET</div>
                <h2>🗞️ 订阅源管理</h2>
                <p>轻量聚合 · 智能晨报</p>
            </div>

            <!-- 搜索框 -->
            <div class="search-container">
                <input type="text" id="search-sources" placeholder="🔍 搜索源名称 / 分类 / 链接...">
            </div>

            <!-- 快速操作区 -->
            <div class="sidebar-actions">
                <button id="btn-add-rss" class="btn btn-primary" title="新增 RSS/Atom 订阅源">+ RSS 源</button>
                <button id="btn-add-json" class="btn btn-primary" title="新增 JSON API 订阅源">+ JSON 源</button>
            </div>

            <div class="sidebar-sub-actions">
                <button id="btn-import-opml" class="btn btn-sub-action" title="从 OPML 文件批量导入订阅">📤 导入 OPML</button>
                <button id="btn-export-opml" class="btn btn-sub-action" title="将 RSS 订阅导出为 OPML 文件">📥 导出 OPML</button>
            </div>

            <!-- 源列表 -->
            <div class="source-list-container">
                <ul id="source-list" class="source-list">
                    <!-- JS 动态渲染源列表 -->
                </ul>
            </div>
        </aside>

        <!-- 主编辑区 -->
        <main class="main-content">
            <header class="top-bar">
                <div class="status-indicator">
                    <span id="save-status">✔️ 已就绪</span>
                </div>
                <div class="global-actions">
                    <button id="btn-open-config" class="btn btn-outline">📁 打开配置文件</button>
                    <button id="btn-preview-email" class="btn btn-accent-preview">📰 预览完整晨报</button>
                    <button id="btn-fetch-test" class="btn btn-secondary" style="display: none;">▶️ 测试抓取当前源</button>
                    <button id="btn-save" class="btn btn-success">💾 保存配置</button>
                </div>
            </header>

            <div id="editor-container" class="editor-container">
                <div class="editor-inner">
                    <!-- 提示没有选中时的空状态 -->
                    <div id="empty-state" class="empty-state">
                        <div style="font-size: 54px; margin-bottom: 16px;">🗞️</div>
                        <h3>准备就绪</h3>
                        <p style="color: var(--fg-muted); margin-top: 8px;">请在左侧选择一个新闻源进行配置编辑，或点击「+ RSS / JSON 源」添加新订阅。</p>
                        <div class="empty-actions" style="margin-top: 24px;">
                            <button id="empty-btn-preview" class="btn btn-outline">📰 预览当前晨报效果</button>
                        </div>
                    </div>

                    <!-- 实际表单域 (JS控制显示) -->
                    <form id="source-form" class="source-form" style="display: none;">
                        <div class="header-row">
                            <h3>新闻源详细设置</h3>
                            <button type="button" class="btn btn-outline" id="btn-delete-source-new">🗑 删除此源</button>
                        </div>

                        <div class="form-group row">
                            <div class="input-field">
                                <label for="name">源名称 *</label>
                                <input type="text" id="name" required placeholder="例如：微博热搜">
                            </div>
                            <div class="input-field">
                                <label for="category">分类</label>
                                <input type="text" id="category" placeholder="同分类将自动聚合显示（例如：科技生活、全球热点）">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="url">URL 地址 *</label>
                            <input type="url" id="url" required placeholder="https://...">
                        </div>

                        <div class="form-group inline-checkbox">
                            <input type="checkbox" id="enabled">
                            <label for="enabled" style="margin-bottom:0;cursor:pointer;">启用此新闻源（每日定时抓取并推送）</label>
                        </div>

                        <input type="hidden" id="type">
                        <input type="hidden" id="index-tracker">

                        <!-- JSON API 高级配置部分 -->
                        <div id="json-config-section" class="advanced-section" style="display: none;">
                            <h3>JSON API 解析配置</h3>
                            <div class="form-group">
                                <label for="items_path">Items Path (列表字段路径)</label>
                                <input type="text" id="items_path" placeholder="例如：data.list，支持嵌套点号路径">
                            </div>
                            <div class="form-group row">
                                <div class="input-field half">
                                    <label for="title_field">Title 标题字段</label>
                                    <input type="text" id="title_field" placeholder="例如：title">
                                </div>
                                <div class="input-field half">
                                    <label for="time_field">Time 发布时间字段</label>
                                    <input type="text" id="time_field" placeholder="（可选）例如：pubdate 或 detail.time">
                                </div>
                            </div>
                            <div class="form-group row">
                                <div class="input-field half">
                                    <label for="link_field">Link 链接字段</label>
                                    <input type="text" id="link_field" placeholder="例如：url 或 short_url">
                                </div>
                                <div class="input-field half">
                                    <label for="link_template">Link 组合模板</label>
                                    <input type="text" id="link_template" placeholder="例如：https://s.weibo.com/weibo?q={word}">
                                </div>
                            </div>
                            <div class="form-group row">
                                <div class="input-field half">
                                    <label for="summary_field">Summary 摘要字段</label>
                                    <input type="text" id="summary_field" placeholder="（可选）例如：desc 或 content">
                                </div>
                            </div>
                        </div>

                        <!-- 自定义 Headers (可选) -->
                        <div class="advanced-section">
                            <h3>自定义请求头 (HTTP Headers)</h3>
                            <div id="headers-container">
                                <!-- 动态增加 header 行 -->
                            </div>
                            <button type="button" id="btn-add-header" class="btn btn-outline text-sm">+ 添加 Header</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 测试结果弹窗 -->
            <div id="test-result-modal" class="modal" style="display:none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="modal-title">测试抓取结果</h3>
                        <button class="close-btn" id="btn-close-test-modal">&times;</button>
                    </div>
                    <div class="modal-body">
                        <pre id="test-result-text">加载中...</pre>
                    </div>
                </div>
            </div>

            <!-- 邮件晨报实时预览全屏弹窗 -->
            <div id="preview-modal" class="modal" style="display:none;">
                <div class="modal-content preview-modal-content">
                    <div class="modal-header">
                        <div class="preview-header-info">
                            <h3>📰 邮件晨报实时渲染预览</h3>
                            <span class="badge" style="background:#ff6b4a;color:#fff;">Cinematic Dusk</span>
                        </div>
                        <div class="preview-header-actions">
                            <button id="btn-refresh-preview" class="btn btn-outline text-sm">🔄 重新抓取生成</button>
                            <button class="close-btn" id="btn-close-preview-modal">&times;</button>
                        </div>
                    </div>
                    <div class="modal-body preview-modal-body">
                        <div id="preview-loading" class="preview-loading" style="display:none;">
                            <div class="spinner"></div>
                            <p>正在并发抓取已启用源并渲染模板...</p>
                        </div>
                        <iframe id="preview-frame" class="preview-frame" title="Email Preview"></iframe>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
